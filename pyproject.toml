[project]
name = "value-scanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.14.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "lxml>=6.0.2",
    "pandas>=2.3.3",
    "playwright>=1.55.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.33",
    "tabulate>=0.9.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Legacy v1 code is excluded until it is replaced (ROADMAP A3-C9); new code must be clean.
extend-exclude = [
    "playwright_utils", "pipeline", "reports_checks", "company_classifiers", "utils",
    "enums", "constants", "main.py", "config.py", "test_cleanup.py", "testing_scripts",
    "tests/verify_innovation_logic.py", "design", "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501"]  # Hebrew report text

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "verify_*.py"]
